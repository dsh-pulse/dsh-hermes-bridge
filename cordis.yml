# dsh-hermes-bridge — M0 出站推送（patch 注册样例）
#
# 开发期：name 用绝对路径指向 lib/index.js；发布期改为 npm 包名。
# token 用 !!js 表达式从环境变量读取，不写死在 YAML（cordis-plugin-loader 支持 !js eval）。
- insert:
    - id: hermes-bridge
      name: '@dsh-pulse/dsh-hermes-bridge'
      config:
        port: 8643
        authToken: '!!js ${env.DSH_BRIDGE_TOKEN}'
        pushTarget: 'weixin:o9cq80xHEWaJokcDZJN-8DTOzrWg@im.wechat'
        hermesBin: '/home/superzealot/.hermes/hermes-agent/venv/bin/hermes'
        retries: 1
        maxTextLen: 1500
